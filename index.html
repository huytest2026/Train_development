<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ thống Trắc nghiệm & Ôn tập</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Giao diện chính của ứng dụng -->
    <div id="app-container">
        
        <!-- Màn hình chọn môn học / nhập mã -->
        <div id="setup-screen" class="screen">
            <h1>Chương trình Trắc nghiệm Ôn tập</h1>
            <div class="form-group">
                <label for="subject-select">Chọn môn học:</label>
                <select id="subject-select" class="form-control">
                    <option value="toan">Môn Toán</option>
                    <option value="anh">Môn Tiếng Anh</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="access-code">Nhập mã truy cập / Tải đề:</label>
                <input type="text" id="access-code" class="form-control" placeholder="Nhập mã...">
            </div>

            <button id="btn-load-data" class="btn btn-primary">Xác nhận Mã & Tải đề</button>
            <button id="btn-tao-de-toan" class="btn btn-success" style="margin-top: 10px;">Tạo Đề Tổng Hợp Môn Toán</button>
            <button id="btn-start-quiz" class="btn btn-warning" onclick="startQuizWithToolCheck()" style="margin-top: 10px;">Bắt đầu làm bài</button>
        </div>

        <!-- Màn hình làm bài Quiz -->
        <div id="quiz-screen" class="screen" style="display: none;">
            <div id="quiz-header">
                <span id="timer">Thời gian: 30:00</span>
                <span id="question-counter">Câu số: 1/10</span>
            </div>
            
            <div id="question-container">
                <!-- Nội dung câu hỏi sẽ được render tự động qua JS -->
            </div>

            <div id="quiz-navigation">
                <button id="btn-prev" class="btn">Câu trước</button>
                <button id="btn-next" class="btn">Câu tiếp theo</button>
                <button id="btn-submit" class="btn btn-danger">Nộp bài</button>
            </div>
        </div>

    </div>

    <!-- Thanh công cụ / Các nút chức năng nổi (Máy tính, Từ điển,...) -->
    <div id="floating-tools" style="position: fixed; bottom: 20px; right: 20px; z-index: 999;">
        <button id="btn-calc" class="btn-tool" onclick="openCalculatorModal()" style="display: none;">🧮 Máy tính</button>
        <button id="btn-dict" class="btn-tool" style="display: none;">📖 Từ điển</button>
        <button id="btn-verbs" class="btn-tool" style="display: none;">📝 Động từ bất quy tắc</button>
    </div>

    <!-- Modal Máy tính khoa học mini (Draggable) -->
    <div id="calc-modal" style="display: none; position: fixed; top: 100px; right: 100px; width: 260px; background: #fff; border: 1px solid #ccc; box-shadow: 0 4px 8px rgba(0,0,0,0.2); z-index: 1000; border-radius: 6px; overflow: hidden;">
        <div id="calc-header" style="background: #007bff; color: white; padding: 8px 12px; cursor: move; display: flex; justify-content: space-between; align-items: center;">
            <span>Máy tính</span>
            <button onclick="closeCalculatorModal()" style="background: none; border: none; color: white; font-size: 16px; cursor: pointer;">&times;</button>
        </div>
        <div style="padding: 10px;">
            <input type="text" id="calc-display" value="0" readonly style="width: 100%; height: 40px; margin-bottom: 10px; text-align: right; font-size: 18px; padding: 5px; box-sizing: border-box;" />
            <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px;">
                <button class="btn-calc-key" onclick="calcClear()">C</button>
                <button class="btn-calc-key" onclick="calcInput('(')">(</button>
                <button class="btn-calc-key" onclick="calcInput(')')">)</button>
                <button class="btn-calc-key" onclick="calcInput('÷')">÷</button>
                <button class="btn-calc-key" onclick="calcInput('7')">7</button>
                <button class="btn-calc-key" onclick="calcInput('8')">8</button>
                <button class="btn-calc-key" onclick="calcInput('9')">9</button>
                <button class="btn-calc-key" onclick="calcInput('×')">×</button>
                <button class="btn-calc-key" onclick="calcInput('4')">4</button>
                <button class="btn-calc-key" onclick="calcInput('5')">5</button>
                <button class="btn-calc-key" onclick="calcInput('6')">6</button>
                <button class="btn-calc-key" onclick="calcInput('-')">-</button>
                <button class="btn-calc-key" onclick="calcInput('1')">1</button>
                <button class="btn-calc-key" onclick="calcInput('2')">2</button>
                <button class="btn-calc-key" onclick="calcInput('3')">3</button>
                <button class="btn-calc-key" onclick="calcInput('+')">+</button>
                <button class="btn-calc-key" onclick="calcInput('0')" style="grid-column: span 2;">0</button>
                <button class="btn-calc-key" onclick="calcInput('.')">.</button>
                <button class="btn-calc-key" onclick="calcCalculate()" style="background: #28a745; color: white;">=</button>
            </div>
        </div>
    </div>

    <!-- Tệp kịch bản chính và mã xử lý logic bổ sung -->
    <script src="script.js"></script>
    <script>
        // --- Tính năng Kéo thả (Draggable) cho máy tính ---
        document.addEventListener('DOMContentLoaded', () => {
            const calcModal = document.getElementById('calc-modal');
            const calcHeader = document.getElementById('calc-header');
            let isDragging = false;
            let offsetX, offsetY;

            if (calcHeader && calcModal) {
                calcHeader.addEventListener('mousedown', (e) => {
                    isDragging = true;
                    offsetX = e.clientX - calcModal.offsetLeft;
                    offsetY = e.clientY - calcModal.offsetTop;
                    calcModal.style.right = 'auto'; 
                });

                document.addEventListener('mousemove', (e) => {
                    if (!isDragging) return;
                    calcModal.style.left = (e.clientX - offsetX) + 'px';
                    calcModal.style.top = (e.clientY - offsetY) + 'px';
                });

                document.addEventListener('mouseup', () => {
                    isDragging = false;
                });
            }
        });

        // --- Các hàm hỗ trợ Mở / Đóng và Tính toán khoa học ---
        window.openCalculatorModal = function() {
            const modal = document.getElementById('calc-modal');
            if (modal) modal.style.display = 'flex';
        };

        window.closeCalculatorModal = function() {
            const modal = document.getElementById('calc-modal');
            if (modal) modal.style.display = 'none';
        };

        window.calcInput = function(val) {
            const display = document.getElementById('calc-display');
            if (display) {
                if (display.value === '0' || display.value === 'Lỗi') display.value = val;
                else display.value += val;
            }
        };

        window.calcClear = function() {
            const display = document.getElementById('calc-display');
            if (display) display.value = '0';
        };

        window.calcCalculate = function() {
            const display = document.getElementById('calc-display');
            if (display) {
                try {
                    let expression = display.value.replace(/×/g, '*').replace(/÷/g, '/');
                    let result = new Function('return ' + expression)();
                    if (result !== undefined && !isNaN(result)) {
                        display.value = Number(result.toFixed(6));
                    } else {
                        display.value = 'Lỗi';
                    }
                } catch (e) {
                    display.value = 'Lỗi';
                }
            }
        };

        // Hàm tự động nhận diện môn học và hiển thị công cụ tương ứng
        window.startQuizWithToolCheck = function() {
            const subjectSelect = document.getElementById('subject-select');
            const selectedSubject = subjectSelect ? subjectSelect.value.toLowerCase() : '';
            
            const btnCalc = document.getElementById('btn-calc');
            const btnDict = document.getElementById('btn-dict');
            const btnVerbs = document.getElementById('btn-verbs');

            const isMath = selectedSubject.includes('toán') || selectedSubject.includes('toan') || selectedSubject.includes('math');
            const isEnglish = selectedSubject.includes('anh') || selectedSubject.includes('english');

            if (isMath) {
                if (btnCalc) btnCalc.style.setProperty('display', 'block', 'important');
                if (btnDict) btnDict.style.display = 'none';
                if (btnVerbs) btnVerbs.style.display = 'none';
            } else if (isEnglish) {
                if (btnCalc) btnCalc.style.display = 'none';
                if (btnDict) btnDict.style.setProperty('display', 'block', 'important');
                if (btnVerbs) btnVerbs.style.setProperty('display', 'block', 'important');
            } else {
                if (btnCalc) btnCalc.style.setProperty('display', 'block', 'important');
            }

            if (typeof window.startQuiz === 'function') {
                window.startQuiz();
            }
        };

        // Kiểm tra hiển thị nút máy tính tự động khi vào màn hình làm bài
        setInterval(() => {
            const quizScreen = document.getElementById('quiz-screen');
            const btnCalc = document.getElementById('btn-calc');
            const subjectSelect = document.getElementById('subject-select');
            
            if (quizScreen && quizScreen.style.display !== 'none' && btnCalc) {
                const subVal = subjectSelect ? subjectSelect.value.toLowerCase() : '';
                if (!subVal.includes('anh') && !subVal.includes('english')) {
                    if (btnCalc.style.display === 'none') {
                        btnCalc.style.setProperty('display', 'block', 'important');
                    }
                }
            }
        }, 500);

        // --- LOGIC XỬ LÝ NÚT TẠO ĐỀ TỔNG HỢP MÔN TOÁN ---
        document.addEventListener('DOMContentLoaded', () => {
            const btnTaoDeToan = document.getElementById('btn-tao-de-toan');
            
            if (btnTaoDeToan) {
                btnTaoDeToan.addEventListener('click', function() {
                    const selectMonHoc = document.getElementById('subject-select');
                    if (!selectMonHoc || (!selectMonHoc.value.toLowerCase().includes('toán') && !selectMonHoc.value.toLowerCase().includes('toan'))) {
                        alert("Vui lòng chọn môn Toán ở mục 'Chọn môn học' trước khi bấm tạo đề Toán!");
                        return;
                    }

                    if (!window.allQuizData || window.allQuizData.length === 0) {
                        alert("Dữ liệu câu hỏi chưa được tải. Vui lòng bấm 'Xác nhận Mã & Tải đề' trước!");
                        return;
                    }

                    let cauHinh = {
                        'Hình học': 2,
                        'Đổi đơn vị': 6,
                        'Phân số': 4,
                        'Phép tính số thập phân': 4,
                        'So sánh phân số': 6
                    };

                    let selectedQuestions = [];

                    for (let chuDe in cauHinh) {
                        let countNeeded = cauHinh[chuDe];
                        let pool = window.allQuizData.filter(q => 
                            q.chuDe && q.chuDe.trim().toLowerCase() === chuDe.toLowerCase()
                        );

                        pool = (typeof shuffleArray === 'function') ? shuffleArray(pool) : pool.sort(() => Math.random() - 0.5);
                        let picked = pool.slice(0, countNeeded);
                        selectedQuestions = selectedQuestions.concat(picked);
                    }

                    if (selectedQuestions.length === 0) {
                        alert("Không tìm thấy dữ liệu câu hỏi phù hợp cho các chủ đề môn Toán!");
                        return;
                    }

                    selectedQuestions = (typeof shuffleArray === 'function') ? shuffleArray(selectedQuestions) : selectedQuestions.sort(() => Math.random() - 0.5);

                    const btnCalc = document.getElementById('btn-calc');
                    const btnDict = document.getElementById('btn-dict');
                    const btnVerbs = document.getElementById('btn-verbs');
                    
                    if (btnCalc) btnCalc.style.setProperty('display', 'block', 'important');
                    if (btnDict) btnDict.style.setProperty('display', 'none', 'important');
                    if (btnVerbs) btnVerbs.style.setProperty('display', 'none', 'important');

                    if (typeof initQuizApp === 'function') {
                        initQuizApp(selectedQuestions);
                        
                        if (typeof window.startTimerTotal === 'function') {
                            window.startTimerTotal(30 * 60);
                        }
                    } else {
                        console.error("Không tìm thấy hàm initQuizApp trong script.js!");
                        alert("Đã tạo đề nhưng có lỗi khởi tạo giao diện quiz.");
                    }
                });
            }
        });
    </script>
</body>
</html>
