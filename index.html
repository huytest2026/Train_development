<!DOCTYPE html>
<html lang="vi" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Trắc Nghiệm Thông Minh</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#3b82f6',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 min-h-screen flex flex-col transition-colors duration-300">

    <!-- Header -->
    <header class="bg-white dark:bg-slate-800 shadow-sm py-4 px-6 flex justify-between items-center">
        <h1 class="text-xl font-bold text-primary flex items-center gap-2">
            <span>📚</span> Hệ Thống Trắc Nghiệm
        </h1>
        <div class="flex items-center gap-4">
            <button id="darkModeToggle" class="p-2 rounded-lg bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 dark:hover:bg-slate-600 transition">
                🌙
            </button>
        </div>
    </header>

    <!-- Main Container -->
    <main class="flex-grow container mx-auto px-4 py-8 max-w-4xl">
        
        <!-- Màn hình đăng nhập / Chọn thông tin -->
        <div id="setupScreen" class="bg-white dark:bg-slate-800 p-6 rounded-2xl shadow-md">
            <h2 class="text-2xl font-bold mb-6 text-center">Thiết Lập Luyện Tập</h2>
            
            <div class="space-y-4">
                <div>
                    <label class="block font-medium mb-1">Mã Học Sinh / Họ Tên:</label>
                    <input type="text" id="studentId" class="w-full p-3 rounded-lg border dark:bg-slate-700 dark:border-slate-600 focus:outline-none focus:ring-2 focus:ring-primary" placeholder="Nhập mã học sinh của bạn...">
                </div>

                <div>
                    <label class="block font-medium mb-1">Chọn Môn Học:</label>
                    <select id="subjectSelect" class="w-full p-3 rounded-lg border dark:bg-slate-700 dark:border-slate-600 focus:outline-none focus:ring-2 focus:ring-primary">
                        <option value="">-- Chọn môn học --</option>
                    </select>
                </div>

                <div>
                    <label class="block font-medium mb-1">Chọn Cấp Độ (Level):</label>
                    <select id="levelSelect" class="w-full p-3 rounded-lg border dark:bg-slate-700 dark:border-slate-600 focus:outline-none focus:ring-2 focus:ring-primary">
                        <option value="1">Level 1 (Cơ bản)</option>
                        <option value="2">Level 2 (Nâng cao)</option>
                        <option value="3">Level 3 (Chuyên sâu)</option>
                    </select>
                </div>

                <div id="topicContainer" class="hidden">
                    <label class="block font-medium mb-1">Chọn Chủ Đề:</label>
                    <div id="topicList" class="grid grid-cols-1 md:grid-cols-2 gap-2 max-h-48 overflow-y-auto p-2 border rounded-lg dark:border-slate-600">
                        <!-- Danh sách chủ đề được sinh động -->
                    </div>
                </div>

                <button onclick="startQuiz()" class="w-full bg-primary text-white font-bold py-3 rounded-lg hover:bg-blue-600 transition shadow-lg">
                    Bắt Đầu Làm Bài
                </button>
            </div>
        </div>

        <!-- Màn hình làm bài (Ẩn mặc định) -->
        <div id="quizScreen" class="hidden bg-white dark:bg-slate-800 p-6 rounded-2xl shadow-md">
            <div class="flex justify-between items-center mb-6 border-b pb-4 dark:border-slate-700">
                <span id="quizProgress" class="font-semibold text-slate-500">Câu 1/10</span>
                <span id="quizTimer" class="font-bold text-red-500">⏱ 00:00</span>
            </div>

            <div id="questionContainer" class="mb-6">
                <!-- Nội dung câu hỏi và các đáp án -->
            </div>

            <div class="flex justify-between">
                <button onclick="prevQuestion()" class="px-5 py-2 bg-slate-200 dark:bg-slate-700 rounded-lg hover:bg-slate-300 transition">Quay lại</button>
                <button onclick="nextQuestion()" class="px-5 py-2 bg-primary text-white rounded-lg hover:bg-blue-600 transition">Tiếp theo</button>
            </div>
        </div>

    </main>

    <!-- JavaScript Logic -->
    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbzlTZJzkxlujhYx5TkVWJYq6XHw0s8yZ6YFBF4VztundlIEEHvz1ZE6ZZC1aPCigl9y/exec"; // Thay thế bằng URL GAS của bạn

        const AppState = {
            allQuizData: [],
            currentQuestions: [],
            currentIndex: 0,
            userAnswers: {},
            studentId: '',
            selectedMon: '',
            selectedLevel: '1',
            selectedTopics: []
        };

        // Tiện ích làm sạch chuỗi
        function cleanKey(str) {
            if (!str) return '';
            return String(str).trim().toLowerCase();
        }

        // Xử lý Dark Mode Toggle
        const darkModeToggle = document.getElementById('darkModeToggle');
        darkModeToggle.addEventListener('click', () => {
            document.documentElement.classList.toggle('dark');
            darkModeToggle.textContent = document.documentElement.classList.contains('dark') ? '☀️' : '🌙';
        });

        // Hàm bắt đầu bài quiz (Đã tích hợp lọc theo Level chính xác)
        function startQuiz() {
            const studentIdInput = document.getElementById('studentId').value.trim();
            const mon = document.getElementById('subjectSelect').value;
            const level = document.getElementById('levelSelect').value;

            if (!studentIdInput) {
                alert('Vui lòng nhập mã học sinh!');
                return;
            }
            if (!mon) {
                alert('Vui lòng chọn môn học!');
                return;
            }

            AppState.studentId = studentIdInput;
            AppState.selectedMon = mon;
            AppState.selectedLevel = level;

            // Lọc danh sách câu hỏi theo môn và cấp độ (Đã sửa lỗi không lọc level)
            let topicPool = AppState.allQuizData.filter(i => {
                let matchMon = cleanKey(i.mon) === cleanKey(mon);
                let matchContent = i.question !== '';
                
                let matchLevel = true;
                if (i.level && String(i.level).trim() !== '') {
                    matchLevel = String(i.level).trim() === String(level).trim() || cleanKey(i.level).includes(level);
                }
                return matchMon && matchContent && matchLevel;
            });

            if (topicPool.length === 0) {
                alert('Không tìm thấy câu hỏi phù hợp với môn và cấp độ này!');
                return;
            }

            // Chuyển màn hình
            document.getElementById('setupScreen').classList.add('hidden');
            document.getElementById('quizScreen').classList.remove('hidden');

            AppState.currentQuestions = topicPool;
            AppState.currentIndex = 0;
            renderQuestion();
        }

        function renderQuestion() {
            const q = AppState.currentQuestions[AppState.currentIndex];
            const container = document.getElementById('questionContainer');
            document.getElementById('quizProgress').textContent = `Câu ${AppState.currentIndex + 1}/${AppState.currentQuestions.length}`;

            container.innerHTML = `
                <h3 class="text-lg font-semibold mb-4">${q.question}</h3>
                <div class="space-y-3">
                    ${['a', 'b', 'c', 'd'].map(opt => q[opt] ? `
                        <label class="flex items-center gap-3 p-3 rounded-lg border dark:border-slate-700 cursor-pointer hover:bg-slate-100 dark:hover:bg-slate-700 transition">
                            <input type="radio" name="answer" value="${opt}" ${AppState.userAnswers[AppState.currentIndex] === opt ? 'checked' : ''} onclick="saveAnswer('${opt}')" class="w-4 h-4 text-primary">
                            <span><strong>${opt.toUpperCase()}.</strong> ${q[opt]}</span>
                        </label>
                    ` : '').join('')}
                </div>
            `;
        }

        function saveAnswer(opt) {
            AppState.userAnswers[AppState.currentIndex] = opt;
        }

        function nextQuestion() {
            if (AppState.currentIndex < AppState.currentQuestions.length - 1) {
                AppState.currentIndex++;
                renderQuestion();
            } else {
                alert('Đã hoàn thành bài làm!');
            }
        }

        function prevQuestion() {
            if (AppState.currentIndex > 0) {
                AppState.currentIndex--;
                renderQuestion();
            }
        }
    </script>
</body>
</html>
