<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trắc nghiệm Động từ bất quy tắc</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Màn hình chính -->
        <div id="start-screen" class="screen">
            <h2>Kiểm tra Động từ Bất Quy Tắc</h2>
            <p>Chọn mã đề hoặc bắt đầu bài kiểm tra của bạn.</p>
            
            <!-- Phần chọn mã đề / cấu hình -->
            <div class="form-group" style="margin-bottom: 15px;">
                <label for="exam-code" style="display: block; margin-bottom: 5px; font-weight: bold;">Chọn mã đề:</label>
                <select id="exam-code" style="width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #ccc;">
                    <option value="all">Tất cả các động từ</option>
                    <option value="code1">Mã đề 1 (Cơ bản)</option>
                    <option value="code2">Mã đề 2 (Nâng cao)</option>
                </select>
            </div>

            <button type="button" class="btn-primary" onclick="startQuiz()" style="width: 100%; padding: 14px; background: #540606; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 1.05em;">Bắt đầu làm bài</button>

            <!-- NÚT MỞ BẢNG ĐỘNG TỪ BẤT QUY TẮC -->
            <button type="button" onclick="window.openIrregularVerbsModal()" style="width: 100%; padding: 14px; background: #17a2b8; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 1.05em; margin-top: 12px; margin-bottom: 5px;">📚 Tra cứu Bảng Động Từ Bất Quy Tắc</button>
        </div>

        <!-- Màn hình làm bài (Quiz Screen) -->
        <div id="quiz-screen" class="screen" style="display: none;">
            <div id="question-container">
                <!-- Nội dung câu hỏi sẽ được render ở đây -->
            </div>
        </div>

        <!-- Màn hình kết quả (Result Screen) -->
        <div id="result-screen" class="screen" style="display: none;">
            <h2>Kết quả bài kiểm tra</h2>
            <div id="score-display" style="margin: 20px 0; font-size: 1.2em;"></div>
            <button type="button" class="btn-primary" onclick="returnToHome()" style="padding: 12px 20px; background: #540606; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold;">Về màn hình chính</button>
        </div>
    </div>

    <!-- MODAL BẢNG ĐỘNG TỪ BẤT QUY TẮC -->
    <div id="irregular-verbs-modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: center;">
        <div class="dict-content" style="background: white; padding: 20px; border-radius: 10px; max-width: 650px; width: 95%; box-shadow: 0 4px 15px rgba(0,0,0,0.2);">
            <h3 style="color: #540606; margin-top: 0; display: flex; justify-content: space-between; align-items: center;">
                📚 Bảng Động Từ Bất Quy Tắc Tiếng Anh
                <button type="button" onclick="window.closeIrregularVerbsModal()" style="background: none; border: none; font-size: 1.2em; cursor: pointer; font-weight: bold;">✕</button>
            </h3>
            <div style="margin-bottom: 12px;">
                <input type="text" id="iv-search-input" placeholder="Nhập từ cần tìm (V1, V2, V3 hoặc nghĩa tiếng Việt)..." oninput="window.filterIrregularVerbs()" style="margin: 0; width: 100%; padding: 12px; border: 1px solid #540606; border-radius: 8px; box-sizing: border-box;">
            </div>
            <div id="iv-result-list" style="max-height: 350px; overflow-y: auto; background: #f8f9fa; padding: 10px; border-radius: 8px; border: 1px solid #ddd;">
                <!-- Danh sách động từ sẽ được render tự động ở đây -->
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
